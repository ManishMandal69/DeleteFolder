<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Lost & Found Portal v5 - Optimized</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
--bg:#0f172a;
--card:#1e293b;
--accent:#38bdf8;
--text:#f1f5f9;
}

body.light{
--bg:#f8fafc;
--card:#ffffff;
--accent:#2563eb;
--text:#111;
}

body{
margin:0;
font-family:Segoe UI, sans-serif;
background:var(--bg);
color:var(--text);
transition:0.3s;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
padding:15px 25px;
background:linear-gradient(90deg,#0ea5e9,#2563eb);
color:white;
align-items:center;
}

header h2{
margin:0;
}

/* NAVIGATION */
nav{
display:none;
gap:15px;
padding:10px;
justify-content:center;
background:var(--card);
flex-wrap:wrap;
}

nav button{
background:none;
color:var(--text);
}

nav button:hover{
color:var(--accent);
}

/* BUTTONS */
button{
padding:8px 14px;
border:none;
cursor:pointer;
border-radius:8px;
transition:0.2s;
font-weight:500;
}

button:hover{
opacity:0.85;
}

.primary{
background:var(--accent);
color:white;
}

/* CARD */
.card{
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
padding:15px;
border-radius:12px;
margin:12px 0;
box-shadow:0 4px 20px rgba(0,0,0,0.2);
transition:0.3s;
}

.card:hover{
transform:translateY(-4px);
}

/* INPUTS */
input,select,textarea{
width:100%;
padding:10px;
margin:6px 0;
border-radius:8px;
border:none;
outline:none;
}

/* SECTIONS */
.section{
display:none;
padding:20px;
max-width:1000px;
margin:auto;
}

.active{
display:block;
}

/* STATS */
.stat-box{
display:flex;
gap:20px;
margin-bottom:20px;
flex-wrap:wrap;
}

.stat{
background:var(--card);
padding:15px;
border-radius:10px;
flex:1;
text-align:center;
font-size:18px;
}

.match-score{
font-weight:bold;
color:#4ade80;
}

/* TOAST */
.toast{
position:fixed;
bottom:20px;
right:20px;
background:var(--accent);
color:white;
padding:10px 15px;
border-radius:6px;
display:none;
}

/* MOBILE */
@media(max-width:600px){
.stat-box{
flex-direction:column;
}
}
</style>
</head>
<body>

<header>
<h2>🎒 Lost & Found Portal</h2>
<div>
<button onclick="toggleTheme()">Theme</button>
<button onclick="logout()">Logout</button>
</div>
</header>

<nav>
<button onclick="showSection('dashboard')">Dashboard</button>
<button onclick="showSection('report')">Report</button>
<button onclick="showSection('list')">Listings</button>
</nav>

<!-- AUTH -->
<div id="auth" class="section active">
<h3>Login / Register</h3>
<input id="authUser" placeholder="Username">
<input id="authPass" type="password" placeholder="Password">
<select id="authRole">
<option value="user">User</option>
<option value="admin">Admin</option>
</select>
<button class="primary" onclick="register()">Register</button>
<button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="section">
<div class="stat-box">
<div class="stat">Lost<br><b id="lostCount">0</b></div>
<div class="stat">Found<br><b id="foundCount">0</b></div>
<div class="stat">Matched<br><b id="matchedCount">0</b></div>
</div>
</div>

<!-- REPORT -->
<div id="report" class="section">
<h3>Report Item</h3>
<form id="itemForm">
<select id="type" required>
<option value="">Select Type</option>
<option value="lost">Lost</option>
<option value="found">Found</option>
</select>

<input id="title" placeholder="Title" required>

<select id="category" required>
<option>Mobile</option>
<option>Wallet</option>
<option>Bag</option>
<option>Documents</option>
<option>Other</option>
</select>

<textarea id="description" placeholder="Description" required></textarea>

<input type="file" id="image">
<img id="preview" style="width:100px;display:none;margin-top:10px">

<button class="primary">Submit</button>
</form>
</div>

<!-- LIST -->
<div id="list" class="section">
<h3>Items</h3>

<input id="search" placeholder="Search..." onkeyup="renderItems()">

<select id="filterStatus" onchange="renderItems()">
<option value="all">All</option>
<option value="Open">Open</option>
<option value="Matched">Matched</option>
</select>

<button onclick="exportData()">Export JSON</button>

<div id="items"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const USERS="LF_USERS";
const ITEMS="LF_ITEMS";
let currentUser=null;

/* SECTION CONTROL */
function showSection(id){
document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* THEME */
function toggleTheme(){
document.body.classList.toggle("light");
}

/* TOAST */
function showToast(msg){
let t=document.getElementById("toast");
t.innerText=msg;
t.style.display="block";
setTimeout(()=>t.style.display="none",2000);
}

/* REGISTER */
function register(){
let users=JSON.parse(localStorage.getItem(USERS))||[];

if(users.some(u=>u.user===authUser.value)){
showToast("User already exists!");
return;
}

users.push({
user:authUser.value,
pass:authPass.value,
role:authRole.value
});

localStorage.setItem(USERS,JSON.stringify(users));
showToast("Registered Successfully!");
}

/* LOGIN */
function login(){
let users=JSON.parse(localStorage.getItem(USERS))||[];
let u=users.find(x=>x.user===authUser.value && x.pass===authPass.value);

if(u){
currentUser=u;
document.querySelector("nav").style.display="flex";
showSection("dashboard");
updateStats();
showToast("Welcome "+u.user);
}else{
alert("Invalid Login");
}
}

/* LOGOUT */
function logout(){
currentUser=null;
document.querySelector("nav").style.display="none";
showSection("auth");
}

/* IMAGE PREVIEW */
image.onchange=e=>{
let reader=new FileReader();
reader.onload=()=>{
preview.src=reader.result;
preview.style.display="block";
}
reader.readAsDataURL(e.target.files[0]);
}

/* ADD ITEM */
itemForm.onsubmit=e=>{
e.preventDefault();

let items=JSON.parse(localStorage.getItem(ITEMS))||[];

let newItem={
id:Date.now(),
type:type.value,
title:title.value,
category:category.value,
description:description.value,
image:preview.src||"",
status:"Open",
date:new Date().toLocaleString()
};

items.push(newItem);
localStorage.setItem(ITEMS,JSON.stringify(items));

matchEngine(newItem);

showToast("Item Added!");
e.target.reset();
preview.style.display="none";
renderItems();
updateStats();
};

/* MATCH ENGINE */
function matchEngine(newItem){
let items=JSON.parse(localStorage.getItem(ITEMS))||[];

items.forEach(item=>{
if(item.id===newItem.id) return;

if(item.type!==newItem.type && item.category===newItem.category){

let score=0;

if(item.title.toLowerCase()===newItem.title.toLowerCase())
score+=40;

if(item.description.toLowerCase().includes(newItem.description.substring(0,5).toLowerCase()))
score+=30;

if(score>=60){
item.status="Matched";
newItem.status="Matched";
showToast("🎯 Match Found!");
}
}
});

localStorage.setItem(ITEMS,JSON.stringify(items));
}

/* RENDER ITEMS */
function renderItems(){
let items=JSON.parse(localStorage.getItem(ITEMS))||[];
let container=document.getElementById("items");
container.innerHTML="";

let searchValue=search.value.toLowerCase();
let statusFilter=filterStatus.value;

items.forEach(item=>{
if(statusFilter!=="all" && item.status!==statusFilter) return;
if(!item.title.toLowerCase().includes(searchValue)) return;

let div=document.createElement("div");
div.className="card";
div.innerHTML=`
<b>${item.title}</b> (${item.type})
<br>Category: ${item.category}
<br>Status: ${item.status}
<br>${item.status==="Matched"?"<span class='match-score'>✔ Matched</span>":""}
`;

container.appendChild(div);
});

if(container.innerHTML===""){
container.innerHTML=`
<div class="card">
<center>No Items Found 😔</center>
</div>`;
}
}

/* STATS */
function updateStats(){
let items=JSON.parse(localStorage.getItem(ITEMS))||[];

lostCount.innerText=items.filter(i=>i.type==="lost").length;
foundCount.innerText=items.filter(i=>i.type==="found").length;
matchedCount.innerText=items.filter(i=>i.status==="Matched").length;
}

/* EXPORT */
function exportData(){
let data=localStorage.getItem(ITEMS);
let blob=new Blob([data],{type:"application/json"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="lost_found_data.json";
a.click();
}
</script>

</body>
</html>
