<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Lost & Found Portal v4 - Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
--bg:#0f172a;
--card:#1e293b;
--accent:#38bdf8;
--text:#f1f5f9;
}

body.light{
--bg:#f8fafc;
--card:#ffffff;
--accent:#2563eb;
--text:#111;
}

body{
margin:0;
font-family:Segoe UI;
background:var(--bg);
color:var(--text);
}

header{
display:flex;
justify-content:space-between;
padding:15px 25px;
background:var(--card);
align-items:center;
}

button{
padding:6px 12px;
border:none;
cursor:pointer;
border-radius:6px;
}

.primary{
background:var(--accent);
color:white;
}

.card{
background:var(--card);
padding:15px;
border-radius:10px;
margin:10px 0;
}

input,select,textarea{
width:100%;
padding:8px;
margin:6px 0;
border-radius:6px;
border:none;
}

.section{display:none;padding:20px;max-width:1100px;margin:auto;}
.active{display:block;}

nav{
display:flex;
gap:15px;
padding:10px;
justify-content:center;
background:var(--card);
}

.toast{
position:fixed;
bottom:20px;
right:20px;
background:var(--accent);
color:white;
padding:10px 15px;
border-radius:6px;
display:none;
}

.stat-box{
display:flex;
gap:20px;
margin-bottom:20px;
}
.stat{
background:var(--card);
padding:10px;
border-radius:6px;
flex:1;
text-align:center;
}
.match-score{
font-weight:bold;
color:#4ade80;
}
</style>
</head>
<body>

<header>
<h2>🎒 Lost & Found Portal v4</h2>
<div>
<button onclick="toggleTheme()">Toggle Theme</button>
<button onclick="logout()">Logout</button>
</div>
</header>

<nav>
<button onclick="showSection('dashboard')">Dashboard</button>
<button onclick="showSection('report')">Report</button>
<button onclick="showSection('list')">Listings</button>
</nav>

<!-- LOGIN -->
<div id="auth" class="section active">
<h3>Login / Register</h3>
<input id="authUser" placeholder="Username">
<input id="authPass" type="password" placeholder="Password">
<select id="authRole">
<option value="user">User</option>
<option value="admin">Admin</option>
</select>
<button class="primary" onclick="register()">Register</button>
<button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="section">
<div class="stat-box">
<div class="stat">Lost: <span id="lostCount">0</span></div>
<div class="stat">Found: <span id="foundCount">0</span></div>
<div class="stat">Matched: <span id="matchedCount">0</span></div>
</div>
</div>

<!-- REPORT -->
<div id="report" class="section">
<h3>Report Item</h3>
<form id="itemForm">
<select id="type" required>
<option value="">Type</option>
<option value="lost">Lost</option>
<option value="found">Found</option>
</select>
<input id="title" placeholder="Title" required>
<select id="category" required>
<option>Mobile</option>
<option>Wallet</option>
<option>Bag</option>
<option>Documents</option>
<option>Other</option>
</select>
<textarea id="description" placeholder="Description" required></textarea>
<input type="file" id="image">
<img id="preview" style="width:100px;display:none">
<button class="primary">Submit</button>
</form>
</div>

<!-- LIST -->
<div id="list" class="section">
<h3>Items</h3>
<input id="search" placeholder="Search..." onkeyup="renderItems()">
<select id="filterStatus" onchange="renderItems()">
<option value="all">All</option>
<option value="Open">Open</option>
<option value="Matched">Matched</option>
</select>
<button onclick="exportData()">Export JSON</button>
<div id="items"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const USERS="LF_USERS";
const ITEMS="LF_ITEMS";
let currentUser=null;

function showSection(id){
document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

function toggleTheme(){
document.body.classList.toggle("light");
}

function showToast(msg){
let t=document.getElementById("toast");
t.innerText=msg;
t.style.display="block";
setTimeout(()=>t.style.display="none",2000);
}

/* AUTH SYSTEM */
function register(){
let users=JSON.parse(localStorage.getItem(USERS))||[];
users.push({
user:authUser.value,
pass:authPass.value,
role:authRole.value
});
localStorage.setItem(USERS,JSON.stringify(users));
showToast("Registered!");
}

function login(){
let users=JSON.parse(localStorage.getItem(USERS))||[];
let u=users.find(x=>x.user===authUser.value && x.pass===authPass.value);
if(u){
currentUser=u;
showSection("dashboard");
updateStats();
showToast("Welcome "+u.user);
}else{
alert("Invalid login");
}
}

function logout(){
currentUser=null;
showSection("auth");
}

/* IMAGE PREVIEW */
image.onchange=e=>{
let reader=new FileReader();
reader.onload=()=>{preview.src=reader.result;preview.style.display="block";}
reader.readAsDataURL(e.target.files[0]);
}

/* ITEM SYSTEM */
itemForm.onsubmit=e=>{
e.preventDefault();
let items=JSON.parse(localStorage.getItem(ITEMS))||[];
let newItem={
id:Date.now(),
type:type.value,
title:title.value,
category:category.value,
description:description.value,
image:preview.src||"",
status:"Close",
date:new Date()
};
items.push(newItem);
localStorage.setItem(ITEMS,JSON.stringify(items));
matchEngine(newItem);
showToast("Item Added!");
e.target.reset();
preview.style.display="none";
renderItems();
updateStats();
}

/* SMART MATCH ENGINE */
function matchEngine(newItem){
let items=JSON.parse(localStorage.getItem(ITEMS))||[];
items.forEach(item=>{
if(item.type!==newItem.type && item.category===newItem.category){
let score=0;
if(item.title===newItem.title) score+=40;
if(item.description.includes(newItem.description.substring(0,4))) score+=30;
score+=30;
if(score>=70){
item.status="Matched";
newItem.status="Matched";
showToast("High Confidence Match Found!");
}
}
});
localStorage.setItem(ITEMS,JSON.stringify(items));
}

/* RENDER */
function renderItems(){
let items=JSON.parse(localStorage.getItem(ITEMS))||[];
let container=document.getElementById("items");
container.innerHTML="";
let searchValue=search.value.toLowerCase();
let statusFilter=filterStatus.value;

items.forEach(item=>{
if(statusFilter!=="all" && item.status!==statusFilter) return;
if(!item.title.toLowerCase().includes(searchValue)) return;

let div=document.createElement("div");
div.className="card";
div.innerHTML=`
<b>${item.title}</b> (${item.type})
<br>Category: ${item.category}
<br>Status: ${item.status}
<br><span class="match-score">${item.status==="Matched"?"✔ Matched":""}</span>
`;
container.appendChild(div);
});
}

/* STATS */
function updateStats(){
let items=JSON.parse(localStorage.getItem(ITEMS))||[];
lostCount.innerText=items.filter(i=>i.type==="lost").length;
foundCount.innerText=items.filter(i=>i.type==="found").length;
matchedCount.innerText=items.filter(i=>i.status==="Matched").length;
}

function exportData(){
let data=localStorage.getItem(ITEMS);
let blob=new Blob([data],{type:"application/json"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="lost_found_data.json";
a.click();
}

</script>

</body>
</html>
